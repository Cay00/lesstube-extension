<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="utf-8" />
  <title>YouTube Customizer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f8f8;
      --surface: #ffffff;
      --text: #181818;
      --muted: #737373;
      --border: #e7e7e7;
      --accent: #ff0033;
      --accent-soft: #fff0f2;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 340px;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI",
        system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    form {
      display: grid;
      gap: 12px;
      max-height: 560px;
      overflow-y: auto;
      padding: 14px;
      scrollbar-width: thin;
      scrollbar-color: #c9c9c9 transparent;
    }

    /* Główne sekcje */

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 12px;
      display: grid;
      gap: 5px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 1px 2px rgb(0 0 0 / 3%);
    }

    legend {
      padding: 0 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.15px;
    }

    /* Wiersze ustawień */

    label {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 32px;
      padding: 5px 7px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 120ms ease;
    }

    label:hover {
      background: #f5f5f5;
    }

    label:has(input:disabled) {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Checkboxy */

    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      flex: 0 0 16px;
      width: 16px;
      height: 16px;
      margin: 0;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition:
        background 120ms ease,
        border-color 120ms ease;
    }

    input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    input[type="checkbox"]:checked::after {
      content: "";
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    input[type="checkbox"]:focus-visible,
    select:focus-visible {
      outline: 2px solid #ff6680;
      outline-offset: 2px;
    }

    /* Listy wyboru */

    select {
      max-width: 145px;
      min-width: 90px;
      margin-left: auto;
      padding: 6px 27px 6px 9px;
      border: 1px solid #dedede;
      border-radius: 7px;
      background-color: #fafafa;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      outline-offset: 2px;
    }

    select:hover {
      border-color: #bdbdbd;
    }

    select:focus {
      border-color: #ff6680;
    }

    /* Podgrupy w lewym pasku */

    .sub {
      display: grid;
      gap: 1px;
      margin: 0 0 5px 13px;
      padding-left: 9px;
      border-left: 2px solid #ededed;
    }

    .sub label {
      min-height: 29px;
      padding: 4px 6px;
      color: #484848;
    }

    /* Nagłówki podsekcji */

    .group {
      margin: 10px 0 2px;
      padding: 0 7px;
      color: #777;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .group:first-of-type {
      margin-top: 5px;
    }

    /* Przewijanie */

    form::-webkit-scrollbar {
      width: 5px;
    }

    form::-webkit-scrollbar-thumb {
      border-radius: 10px;
      background: #c9c9c9;
    }

    form::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 15px 16px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .header strong,
    .header small {
      display: block;
    }

    .header strong {
      font-size: 14px;
      font-weight: 750;
    }

    .header small {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div>
      <strong>YouTube Customizer</strong>
      <small>Dostosuj swój YouTube</small>
    </div>
  </header>
  <form>
    <fieldset>
      <legend>Strona główna</legend>
      <label>
        Przekierowanie główne
        <select name="homeRedirect">
          <option value="home">Strona główna</option>
          <option value="subscriptions">Subskrypcje</option>
          <option value="history">Historia</option>
          <option value="library">Biblioteka</option>
        </select>
      </label>
      <label><input type="checkbox" name="hideSuggestions" /> Ukryj sugestie</label>
      <label>
        Kolumny
        <select name="columns">
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
        </select>
      </label>
      <label><input type="checkbox" name="hideMixes" /> Ukryj playlisty i składanki</label>
      <label><input type="checkbox" name="hideAds" /> Ukryj reklamy</label>
      <label><input type="checkbox" name="hideShorts" /> Ukryj Shorts</label>
      <label><input type="checkbox" name="hideGames" /> Ukryj Pokój gier</label>
    </fieldset>

    <fieldset>
      <legend>Lewy pasek</legend>
      <p class="group">Główne</p>
      <label><input type="checkbox" name="hideHomeSection" /> Ukryj całą sekcję</label>
      <div class="sub">
        <label><input type="checkbox" name="hideGuideHome" /> Strona główna</label>
        <label><input type="checkbox" name="hideGuideShorts" /> Shorts</label>
      </div>
      <p class="group">Subskrypcje</p>
      <label><input type="checkbox" name="hideSubscriptionsSection" /> Ukryj całą sekcję</label>
      <div class="sub">
        <label><input type="checkbox" name="hideGuideSubscriptions" /> Subskrypcje</label>
        <label><input type="checkbox" name="expandSubscriptions" /> Rozwiń wszystkie</label>
      </div>
      <p class="group">Ty</p>
      <label><input type="checkbox" name="hideLibrarySection" /> Ukryj całą sekcję</label>
      <div class="sub">
        <label><input type="checkbox" name="hideGuideYou" /> Ty</label>
        <label><input type="checkbox" name="hideGuideChannel" /> Twój kanał</label>
        <label><input type="checkbox" name="hideGuideHistory" /> Historia</label>
        <label><input type="checkbox" name="hideGuidePlaylists" /> Playlisty</label>
        <label><input type="checkbox" name="hideGuideWatchLater" /> Do obejrzenia</label>
        <label><input type="checkbox" name="hideGuideLiked" /> Polubione filmy</label>
        <label><input type="checkbox" name="hideGuideYourVideos" /> Twoje filmy</label>
        <label><input type="checkbox" name="hideGuideDownloads" /> Pobrane</label>
        <label><input type="checkbox" name="hideGuideCourses" /> Kursy</label>
        <label><input type="checkbox" name="hideGuideClips" /> Klipy</label>
        <label><input type="checkbox" name="hideGuideLibraryShowMore" /> Pokaż mniej</label>
      </div>
      <p class="group">Odkrywaj</p>
      <label><input type="checkbox" name="hideExploreSection" /> Ukryj całą sekcję</label>
      <div class="sub">
        <label><input type="checkbox" name="hideGuideExploreMusic" /> Muzyka</label>
        <label><input type="checkbox" name="hideGuideMovies" /> Filmy</label>
        <label><input type="checkbox" name="hideGuideHype" /> Podbijanie</label>
        <label><input type="checkbox" name="hideGuideLive" /> Na żywo</label>
        <label><input type="checkbox" name="hideGuideGaming" /> Gry</label>
        <label><input type="checkbox" name="hideGuideNews" /> Wiadomości</label>
        <label><input type="checkbox" name="hideGuideSports" /> Sport</label>
        <label><input type="checkbox" name="hideGuidePodcasts" /> Podcasty</label>
        <label><input type="checkbox" name="hideGuidePlayables" /> Pokój gier</label>
        <label><input type="checkbox" name="hideGuideSupport" /> Wspieranie kanału</label>
        <label><input type="checkbox" name="hideGuideExploreShowMore" /> Pokaż mniej</label>
      </div>
      <p class="group">Więcej z YouTube</p>
      <label><input type="checkbox" name="hideMoreSection" /> Ukryj całą sekcję</label>
      <div class="sub">
        <label><input type="checkbox" name="hideGuideMusic" /> YouTube Music</label>
        <label><input type="checkbox" name="hideGuideKids" /> YouTube Kids</label>
        <label><input type="checkbox" name="hideGuideReports" /> Historia zgłoszeń</label>
        <label><input type="checkbox" name="hideGuideFooter" /> Stopka</label>
      </div>
    </fieldset>
  </form>
  <script src="popup.js"></script>
</body>

</html>
