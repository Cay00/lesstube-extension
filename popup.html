<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customizer for YouTube</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" class="logo-bg" />
          <path d="M8 11h16M8 21h16" class="logo-line" />
          <circle cx="20" cy="11" r="3.2" class="logo-knob" />
          <circle cx="12" cy="21" r="3.2" class="logo-knob" />
        </svg>
        <div>
          <h1>Customizer for YouTube</h1>
          <p id="subtitle"></p>
        </div>
      </div>
      <label class="power" id="powerWrap">
        <span id="powerLabel"></span>
        <input type="checkbox" id="enabled" role="switch" />
        <span class="track" aria-hidden="true"></span>
      </label>
    </header>

    <div class="searchbar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m20 20-4.9-4.9" /></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" />
    </div>

    <div class="body">
      <nav id="rail" class="rail"></nav>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
