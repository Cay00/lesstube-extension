name: Update Extension Stats

on:
  schedule:
    - cron: '0 0 * * *'   # codziennie o północy UTC
  workflow_dispatch:       # możliwość ręcznego uruchomienia

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # pozwala na commit i push

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run update-stats

      - name: Commit & Push
        run: |
          git config user.name = "github-actions[bot]"
          git config user.email = "github-actions[bot]@users.noreply.github.com"
          git add .github/extension-stats.json
          git diff --cached --quiet || git commit -m "chore: update extension stats"
          git push